[project]
name = "mesa247-waitlist"
version = "0.1.0"
description = "Lista de espera digital - corte para el piloto de tres locales"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
# Ruido de starlette y fastapi sobre Python 3.14, no de nuestro codigo.
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore:.*iscoroutinefunction.*:DeprecationWarning",
    "ignore:.*BlockingPortal.*:DeprecationWarning",
]
